name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  lint-and-test:
    name: Lint & Tests
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: ["18.x", "20.x"]

    steps:
      # Checkout du code
      - name: Checkout du code
        uses: actions/checkout@v4

      # Configuration de Node.js
      - name: Configuration de Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      # Installer les dépendances
      - name: Installation des dépendances
        run: npm ci

      # Lint du code
      - name: Lint du code
        run: npm run lint || true

      # Exécution des tests avec couverture
      - name: Exécution des tests avec couverture
        run: npm test -- --coverage --coverageReporters=text --coverageReporters=lcov

      # Vérification du répertoire coverage
      - name: Vérification du répertoire coverage
        run: ls -R coverage/

      # Upload du rapport de couverture
      - name: Upload du rapport de couverture
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-node-${{ matrix.node-version }}
          path: coverage/

  code-quality:
    name: Qualité du code
    runs-on: ubuntu-latest
    needs: lint-and-test

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Configuration Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: 'npm'

      - name: Installation des dépendances
        run: npm ci

      - name: Vérification des vulnérabilités
        run: npm audit --audit-level=high || true

      - name: Vérification des dépendances obsolètes
        run: npm outdated || true